name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, format, types, build, tests, Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check build icons
        run: node scripts/verify-build-assets.mjs

      - name: Temporary inspect Prettier output
        run: |
          for file in src/shared/api/edgeKey.ts src/shared/youtube/innertube/webRemixAudio.ts src/shared/youtube/innertube/webRemixAudio.test.ts; do
            echo "===== PRETTIER OUTPUT: $file ====="
            pnpm exec prettier "$file"
          done

      - name: Check
        run: pnpm check

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Add Android platform
        run: pnpm android:add

      - name: Sync Android app
        run: pnpm android:sync

      - name: Assemble debug APK
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Upload installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: liner-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
