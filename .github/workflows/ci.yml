name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    name: Lint, format, types, build, tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format the Android playback runtime
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          pnpm exec prettier --write src/features/player/engine/playerRuntime.ts
          if ! git diff --quiet -- src/features/player/engine/playerRuntime.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/features/player/engine/playerRuntime.ts
            git commit -m "chore: format Android playback runtime"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

      - name: Check build icons
        run: node scripts/verify-build-assets.mjs

      - name: Check
        run: pnpm check
